# Reconciliação de PIX pendentes, expiração e reprocessamento de webhooks a cada 5 min.
# Complementa o Vercel Cron (diário no plano Hobby). Secrets do repositório:
#   SITE_URL    → https://www.clearfingerbr.shop
#   CRON_SECRET → mesmo valor da variável CRON_SECRET na Vercel
name: jobs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Executar /api/cron/all
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets não configurados"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/all" | head -c 600
